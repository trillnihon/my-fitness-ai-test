<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness AI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
<title>My Fitness AI</title>
</head>
<body>
<header class="topbar">
  <button id="backBtn" class="icon-btn" aria-label="戻る" hidden>‹</button>
  <h1 id="title">My Fitness AI</h1>
  <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙</button>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabbar">
  <a href="#/" data-tab="home">ホーム</a>
  <a href="#/meal" data-tab="meal">食事</a>
  <a href="#/workout" data-tab="workout">運動</a>
  <a href="#/results" data-tab="results">結果</a>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="lock" hidden>
  <div class="lock-box">
    <h2>My Fitness AI</h2>
    <p>パスコードを入力</p>
    <input id="lockInput" type="password" inputmode="numeric" autocomplete="off">
    <button id="lockBtn" class="btn primary">開く</button>
    <p id="lockMsg" class="muted"></p>
  </div>
</div>
<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/coach.js"></script>
<script src="js/charts.js"></script>
<script src="js/barcode.js"></script>
<script src="js/app.js"></script>
</body>
</html>
